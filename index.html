<!doctype html>
<html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Quest</title>
<style>
:root{font-family:system-ui,sans-serif;color:#253b31;background:#f3f0df}*{box-sizing:border-box}body{margin:0}header{background:#214e3d;color:#fff;padding:20px max(20px,calc((100vw - 1000px)/2))}header h1{margin:0}main{max-width:1000px;margin:auto;padding:20px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#285b45;color:white}button:hover{filter:brightness(1.15)}button.secondary{background:#dfe9db;color:#214e3d}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.toolbar select{flex:1;min-width:200px}.panel{background:#fffdf4;border:2px solid #e3dfc9;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 15px #203e2612}h2{margin-top:0}.map{position:relative;min-height:430px;background:radial-gradient(circle at 20% 30%,#dcebb9,transparent 35%),radial-gradient(circle at 80% 65%,#c5e1d2,transparent 38%),#f1e6be;border-radius:16px;overflow:hidden;border:2px solid #c9b989}.map svg{width:100%;height:430px;display:block}.stop{cursor:pointer}.stop circle{stroke:#fff8de;stroke-width:4}.stop text{font-weight:700;fill:#fff;font-size:13px;pointer-events:none}.stop.done circle{fill:#33845a}.stop.todo circle{fill:#9d886b}.stop.active circle{fill:#d18c32}.list{display:grid;gap:8px}.task{display:flex;align-items:center;gap:10px;padding:12px;background:#f5f2e5;border-radius:12px}.task span{flex:1}.task.done span{text-decoration:line-through;opacity:.6}.task button{padding:7px 10px}.progress{height:13px;background:#d8e0d0;border-radius:12px;overflow:hidden}.progress div{height:100%;background:#3c9868;transition:width .3s}dialog{border:0;border-radius:18px;padding:24px;width:min(92vw,440px);box-shadow:0 15px 60px #0005}dialog::backdrop{background:#0007}label{display:block;margin:12px 0}label input,label textarea{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #c6cbbd;border-radius:8px}small{color:#586d5f}.empty{text-align:center;padding:50px 10px}
.map{min-height:0;background:#e4eccf}.map svg{height:auto!important;display:block}.map .stop{outline:none}.map .stop:focus circle{stroke:#edaa38;stroke-width:7}.map .stop text{font-size:17px}.map .stop .stoplabel{font-size:15px;fill:#254436;stroke:#f8f0d3;stroke-width:4;paint-order:stroke}.map .stop .symbol{font-size:28px}.toolhint{padding:12px;background:#e8f2df;border-radius:10px;line-height:1.5;margin:12px 0}#direction{padding:9px;border-radius:8px;border:1px solid #b6c8af;margin-left:8px}#taskOptions select{width:100%;padding:10px;border-radius:8px;border:1px solid #b6c8af} .map{overflow:hidden}@media(max-width:600px){main{padding:10px}.panel{padding:12px}.map .stop .stoplabel{font-size:17px}.toolbar{align-items:center}button{min-height:42px}}</style>
<header><h1>🧭 Project Quest</h1><div>Every great project begins with a journey</div></header>
<main><div class="toolbar"><select id="projects" aria-label="Choose project"></select><button id="newProject">+ New quest</button><button class="secondary" id="export">Export backup</button><button class="secondary" id="import">Import backup</button><input hidden type="file" id="file" accept=".json,application/json"></div><section class="panel" id="overview"></section><section class="panel"><h2>🗺️ Adventure map</h2><div class="toolbar"><label>Journey direction <select id="direction"><option value="bottom">Start at bottom</option><option value="top">Start at top</option></select></label></div><div class="map" id="map"></div></section><section class="panel"><h2>Journey stops</h2><div class="list" id="tasks"></div><p><button id="add">+ Add stop</button></p></section><small>Saved on this device in your browser. Export backups regularly, especially before clearing browser data.</small></main>
<dialog id="editor"><form method="dialog" id="editForm"><h2 id="dialogTitle">Journey stop</h2><label>Name<input id="name" required maxlength="100"></label><label>Description<textarea id="description" rows="3"></textarea></label><div id="taskOptions"><label>Estimated duration <input id="duration" type="number" min="0" max="9999" step="5" placeholder="e.g. 45" inputmode="numeric"> <small>minutes</small></label><label>How does this task feel?<select id="feeling"><option value="normal">Normal journey</option><option value="easy">Easy, a sunny clearing</option><option value="dragon">🐉 Dragon, feels hard</option><option value="fear">🌑 Dark forest, imaginary fear</option><option value="boring">🧚 Endless plain, boring</option><option value="distraction">🧙 Side paths, distractions</option><option value="stuck">🪜 Ditch of surrender, stuck</option><option value="boulder">🔨 Boulder, too big</option></select></label><div id="toolHint" class="toolhint"></div><div id="magicPlan" class="toolhint" hidden></div></div><div class="toolbar"><button id="save" type="submit">Save</button><button type="button" class="secondary" id="cancel">Cancel</button><button type="button" class="secondary" id="remove">Delete</button></div></form></dialog>
<script>
const KEY='project-quest-v1';const $=id=>document.getElementById(id);let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.projects))data={projects:[],selected:null};let editing=null,mode='task';
const challenges={dragon:['⚔️ Sword of Courage','I can do hard things. I am capable. I can choose to try.'],fear:['✨ Wand of Positive What Ifs','What if this goes well? What if I can learn as I go?'],boring:['🧚 Fun Fairy Companion','Add a small game, music or reward to make this stretch more enjoyable.'],distraction:['🧙 Wise Wizard','Choose one focus action now. Could your phone go in a drawer?'],stuck:['🪜 Can-Reach-Anywhere Ladder','Why does this matter? What is the smallest next step?'],boulder:['🔨 Can-Crush-Anything Hammer','Break this task into two or three smaller tasks. What is the first piece?'],easy:['🌟 Golden Star','Enjoy this easy win and build momentum.']};const scenery={meadow:['#cfe8b3','🌼','🌳'],forest:['#b0d1aa','🌲','🌳'],river:['#b4dedb','🌊','🌿'],desert:['#ecd9a2','🌵','🏜️'],mountain:['#c9d6d5','⛰️','🌲']};const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const saveData=()=>localStorage.setItem(KEY,JSON.stringify(data));
const current=()=>data.projects.find(p=>p.id===data.selected);
function render(){const sel=$('projects');sel.innerHTML='';for(const p of data.projects){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.append(o)}if(!current()&&data.projects.length)data.selected=data.projects[0].id;sel.value=data.selected||'';const p=current();$('add').disabled=!p;$('direction').value=p?.direction||'bottom';
if(!p){$('overview').innerHTML='<div class="empty"><h2>Welcome, adventurer!</h2><p>Create your first project quest to begin.</p></div>';$('map').innerHTML='';$('tasks').innerHTML='';return}
const done=p.tasks.filter(t=>t.done).length,total=p.tasks.length,pct=total?Math.round(done/total*100):0;
$('overview').innerHTML='<h2></h2><p></p><strong>'+pct+'% complete · '+done+' of '+total+' stops</strong><div class="progress"><div style="width:'+pct+'%"></div></div><p><button class="secondary" id="rename">Edit quest</button> <button class="secondary" id="deleteQuest">Delete quest</button></p>';
$('overview').querySelector('h2').textContent=p.name;$('overview').querySelector('p').textContent=p.description||'Your next adventure awaits';$('rename').onclick=()=>openEditor('project',p);$('deleteQuest').onclick=()=>{if(confirm('Delete this quest and all its stops?')){data.projects=data.projects.filter(x=>x.id!==p.id);data.selected=data.projects[0]?.id||null;saveData();render()}};
const n=p.tasks.length, direction=p.direction||'bottom', spacing=168, H=Math.max(520,(n+1)*spacing+120), W=360;
const pos=p.tasks.map((t,i)=>({x: i%2===0?118:236,y:direction==='bottom'?H-135-i*spacing:135+i*spacing}));
let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Vertical adventure map. Tap a stop to edit it.">';
svg+='<rect width="360" height="'+H+'" fill="#efe6ca"/>';svg+='<defs><filter id="paint"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="14"/></filter></defs>';
for(let y=0;y<H;y+=500){const phase=Math.floor(y/500)%4;const palettes=[['#b3cfa2','#8bb88d'],['#b3d4c7','#74b9c9'],['#e6d4a5','#d5b779'],['#bfc7ce','#9baeb7']];const col=palettes[phase];svg+='<path d="M0 '+y+' Q95 '+(y-75)+' 185 '+(y+60)+' T360 '+y+' L360 '+(y+500)+' Q200 '+(y+450)+' 0 '+(y+500)+'Z" fill="'+col[0]+'" opacity=".75" filter="url(#paint)"/><path d="M0 '+(y+180)+' Q80 '+(y+130)+' 160 '+(y+190)+' T360 '+(y+140)+' L360 '+(y+340)+' Q180 '+(y+260)+' 0 '+(y+340)+'Z" fill="'+col[1]+'" opacity=".33" filter="url(#paint)"/>';for(let x=30;x<360;x+=95){const emoji=phase===0?'🌳':phase===1?'🌊':phase===2?'🌾':'⛰️';svg+='<text x="'+(x+((y+x)%35))+'" y="'+(y+95+(x%3)*80)+'" font-size="40" opacity=".8">'+emoji+'</text>'}};svg+='<path d="M-20 '+(H*.42)+' Q160 '+(H*.48)+' 380 '+(H*.37)+'" stroke="#77b9ce" stroke-width="28" opacity=".58" fill="none" filter="url(#paint)"/>';
const startY=direction==='bottom'?H-55:55,finishY=direction==='bottom'?55:H-55;
const points=[{x:180,y:startY},...pos,{x:180,y:finishY}];let d='M '+points[0].x+' '+points[0].y;for(let i=1;i<points.length;i++){const prev=points[i],pt=points[i-1];d+=' C '+pt.x+' '+((pt.y+prev.y)/2)+' '+prev.x+' '+((pt.y+prev.y)/2)+' '+prev.x+' '+prev.y}
svg+='<path d="'+d+'" fill="none" stroke="#f7e9bb" stroke-width="27" stroke-linecap="round"/><path d="'+d+'" fill="none" stroke="#b79862" stroke-width="3" stroke-dasharray="5 10" stroke-linecap="round"/>';
svg+='<text x="180" y="'+(startY-17)+'" text-anchor="middle" font-size="27">🏕️</text><text x="180" y="'+(startY+22)+'" text-anchor="middle" font-size="15" font-weight="bold" fill="#214e3d">START</text>';
svg+='<text x="180" y="'+(finishY-17)+'" text-anchor="middle" font-size="29">🏰</text><text x="180" y="'+(finishY+23)+'" text-anchor="middle" font-size="15" font-weight="bold" fill="#214e3d">FINISH</text>';
pos.forEach((pt,i)=>{const t=p.tasks[i],feel=t.feeling||'normal',symbol=t.done?'✓':({dragon:'🐉',fear:'🌑',boring:'🧚',distraction:'🧙',stuck:'🪜',boulder:'🪨',easy:'🌟'}[feel]||String(i+1));svg+='<g class="stop '+(t.done?'done':i===done?'active':'todo')+'" tabindex="0" role="button" aria-label="Edit '+escapeHtml(t.name)+'" data-index="'+i+'" transform="translate('+pt.x+','+pt.y+')"><circle r="35"/><text class="symbol" text-anchor="middle" y="10">'+symbol+'</text><text class="stoplabel" text-anchor="middle" y="60">'+escapeHtml(t.name.slice(0,22))+'</text></g>'});
svg+='</svg>';$('map').innerHTML=svg;$('map').querySelectorAll('.stop').forEach(el=>{const open=()=>openEditor('task',p.tasks[Number(el.dataset.index)]);el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});
$('tasks').innerHTML='';p.tasks.forEach((t,i)=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.setAttribute('aria-label','Complete '+t.name);cb.onchange=()=>{t.done=cb.checked;saveData();render()};const label=document.createElement('span');label.textContent=(i+1)+'. '+t.name+(t.duration?' · ⏳ '+t.duration+' min':'');const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>openEditor('task',t);const up=document.createElement('button');up.textContent='↑';up.disabled=i===0;up.onclick=()=>move(i,-1);const down=document.createElement('button');down.textContent='↓';down.disabled=i===p.tasks.length-1;down.onclick=()=>move(i,1);row.append(cb,label,up,down,edit);$('tasks').append(row)});}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function move(i,delta){const a=current().tasks;[a[i],a[i+delta]]=[a[i+delta],a[i]];saveData();render()}
function openEditor(type,item){mode=type;editing=item||null;$('taskOptions').hidden=type!=='task';$('duration').value=item?.duration||'';$('feeling').value=item?.feeling||'normal';showTool();$('dialogTitle').textContent=type==='project'?'Quest details':'Journey stop';$('name').value=item?.name||'';$('description').value=item?.description||'';$('remove').hidden=!item||type==='project';$('editor').showModal();$('name').focus()}
$('editForm').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;const description=$('description').value.trim();const duration=Math.max(0,Number($('duration').value)||0),feeling=$('feeling').value;const plan=collectPlan();if(mode==='project'){if(editing){editing.name=name;editing.description=description}else{const p={id:uid(),name,description,tasks:[]};data.projects.push(p);data.selected=p.id}}else if(editing){editing.name=name;editing.description=description;editing.duration=duration;editing.feeling=feeling;editing.plan=plan}else{current().tasks.push({id:uid(),name,description,duration,feeling,plan,done:false})}saveData();$('editor').close();render()};
$('cancel').onclick=()=>$('editor').close();$('remove').onclick=()=>{if(editing&&confirm('Delete this stop?')){current().tasks=current().tasks.filter(t=>t!==editing);saveData();$('editor').close();render()}};
$('newProject').onclick=()=>openEditor('project');$('add').onclick=()=>openEditor('task');$('projects').onchange=e=>{data.selected=e.target.value;saveData();render()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project-quest-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.projects)||!incoming.projects.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.tasks)&&p.tasks.every(t=>typeof t.id==='string'&&typeof t.name==='string')))throw Error('Invalid backup');if(confirm('Replace your current projects with this backup?')){data=incoming;saveData();render()}}catch(err){alert('Could not import backup: '+err.message)}e.target.value=''};
$('direction').onchange=e=>{const p=current();if(p){p.direction=e.target.value;saveData();render()}};const prompts={dragon:[['first','What is one brave first step?','I will try for five minutes'],['support','What would help you feel capable?','Remember a challenge I overcame']],fear:[['whatif','What positive “what if” could also be true?','What if I learn something useful?'],['reality','What evidence helps ground this worry?','I have done something similar before']],boring:[['fun','How could you make this more enjoyable?','Play music or use a timer'],['reward','What small reward will you give yourself?','Have a cup of tea afterwards']],distraction:[['phone','Where will you put your phone or distracting devices?','In a drawer, on silent or in another room'],['place','Where will you do this task?','At my desk, in the library or a quiet room'],['focus','What else will help you stay focused?','Close extra tabs, set a 25-minute timer']],stuck:[['purpose','Why is this task important to you?','It moves me towards my goal'],['step','What is the smallest next action?','Open the document and write one sentence']],boulder:[['piece','What smaller piece can you do first?','Write an outline'],['split','What other small steps could you split this into?','Research, draft, review']]};
function renderPlan(saved={}){const type=$('feeling').value,items=prompts[type];const area=$('magicPlan');area.hidden=!items;if(!items){area.replaceChildren();return}area.replaceChildren();const heading=document.createElement('strong');heading.textContent='✨ Your magical action plan';area.append(heading);items.forEach(([key,q,example])=>{const label=document.createElement('label');label.textContent=q;const field=document.createElement('textarea');field.rows=2;field.dataset.plan=key;field.placeholder='For example: '+example;field.value=saved[key]||'';label.append(field);area.append(label)})}
function collectPlan(){const plan={};$('magicPlan').querySelectorAll('[data-plan]').forEach(el=>{plan[el.dataset.plan]=el.value.trim()});return plan}
function showTool(){const info=challenges[$('feeling').value];$('toolHint').hidden=!info;$('toolHint').textContent=info?info[0]+' — '+info[1]:'';renderPlan(editing?.feeling===$('feeling').value?editing?.plan||{}:{})}
$('feeling').onchange=showTool;render();
</script></html>
