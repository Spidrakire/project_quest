<!doctype html>
<html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Quest</title>
<style>
:root{font-family:system-ui,sans-serif;color:#253b31;background:#f3f0df}*{box-sizing:border-box}body{margin:0}header{background:#214e3d;color:#fff;padding:20px max(20px,calc((100vw - 1000px)/2))}header h1{margin:0}main{max-width:1000px;margin:auto;padding:20px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#285b45;color:white}button:hover{filter:brightness(1.15)}button.secondary{background:#dfe9db;color:#214e3d}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.toolbar select{flex:1;min-width:200px}.panel{background:#fffdf4;border:2px solid #e3dfc9;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 15px #203e2612}h2{margin-top:0}.map{position:relative;min-height:430px;background:radial-gradient(circle at 20% 30%,#dcebb9,transparent 35%),radial-gradient(circle at 80% 65%,#c5e1d2,transparent 38%),#f1e6be;border-radius:16px;overflow:hidden;border:2px solid #c9b989}.map svg{width:100%;height:430px;display:block}.stop{cursor:pointer}.stop circle{stroke:#fff8de;stroke-width:4}.stop text{font-weight:700;fill:#fff;font-size:13px;pointer-events:none}.stop.done circle{fill:#33845a}.stop.todo circle{fill:#9d886b}.stop.active circle{fill:#d18c32}.list{display:grid;gap:8px}.task{display:flex;align-items:center;gap:10px;padding:12px;background:#f5f2e5;border-radius:12px}.task span{flex:1}.task.done span{text-decoration:line-through;opacity:.6}.task button{padding:7px 10px}.progress{height:13px;background:#d8e0d0;border-radius:12px;overflow:hidden}.progress div{height:100%;background:#3c9868;transition:width .3s}dialog{border:0;border-radius:18px;padding:24px;width:min(92vw,440px);box-shadow:0 15px 60px #0005}dialog::backdrop{background:#0007}label{display:block;margin:12px 0}label input,label textarea{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #c6cbbd;border-radius:8px}small{color:#586d5f}.empty{text-align:center;padding:50px 10px}
</style>
<header><h1>🧭 Project Quest</h1><div>Every great project begins with a journey</div></header>
<main><div class="toolbar"><select id="projects" aria-label="Choose project"></select><button id="newProject">+ New quest</button><button class="secondary" id="export">Export backup</button><button class="secondary" id="import">Import backup</button><input hidden type="file" id="file" accept=".json,application/json"></div><section class="panel" id="overview"></section><section class="panel"><h2>🗺️ Adventure map</h2><div class="map" id="map"></div></section><section class="panel"><h2>Journey stops</h2><div class="list" id="tasks"></div><p><button id="add">+ Add stop</button></p></section><small>Saved on this device in your browser. Export backups regularly, especially before clearing browser data.</small></main>
<dialog id="editor"><form method="dialog" id="editForm"><h2 id="dialogTitle">Journey stop</h2><label>Name<input id="name" required maxlength="100"></label><label>Description<textarea id="description" rows="3"></textarea></label><div class="toolbar"><button id="save" type="submit">Save</button><button type="button" class="secondary" id="cancel">Cancel</button><button type="button" class="secondary" id="remove">Delete</button></div></form></dialog>
<script>
const KEY='project-quest-v1';const $=id=>document.getElementById(id);let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.projects))data={projects:[],selected:null};let editing=null,mode='task';
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const saveData=()=>localStorage.setItem(KEY,JSON.stringify(data));
const current=()=>data.projects.find(p=>p.id===data.selected);
function render(){const sel=$('projects');sel.innerHTML='';for(const p of data.projects){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.append(o)}if(!current()&&data.projects.length)data.selected=data.projects[0].id;sel.value=data.selected||'';const p=current();$('add').disabled=!p;
if(!p){$('overview').innerHTML='<div class="empty"><h2>Welcome, adventurer!</h2><p>Create your first project quest to begin.</p></div>';$('map').innerHTML='';$('tasks').innerHTML='';return}
const done=p.tasks.filter(t=>t.done).length,total=p.tasks.length,pct=total?Math.round(done/total*100):0;
$('overview').innerHTML='<h2></h2><p></p><strong>'+pct+'% complete · '+done+' of '+total+' stops</strong><div class="progress"><div style="width:'+pct+'%"></div></div><p><button class="secondary" id="rename">Edit quest</button> <button class="secondary" id="deleteQuest">Delete quest</button></p>';
$('overview').querySelector('h2').textContent=p.name;$('overview').querySelector('p').textContent=p.description||'Your next adventure awaits';$('rename').onclick=()=>openEditor('project',p);$('deleteQuest').onclick=()=>{if(confirm('Delete this quest and all its stops?')){data.projects=data.projects.filter(x=>x.id!==p.id);data.selected=data.projects[0]?.id||null;saveData();render()}};
const count=Math.max(p.tasks.length,2),W=900,H=Math.max(420,Math.ceil(count/5)*260);const positions=p.tasks.map((t,i)=>({x:90+(i%5)*175,y:90+Math.floor(i/5)*240+((i%5)%2)*85}));let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Project journey map"><defs><pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.5" fill="#bdc7a2"/></pattern></defs><rect width="100%" height="100%" fill="url(#dots)"/>';
if(positions.length){let d='M '+positions[0].x+' '+positions[0].y;positions.slice(1).forEach((pt,i)=>{const prev=positions[i];d+=' Q '+((prev.x+pt.x)/2)+' '+(prev.y-60)+' '+pt.x+' '+pt.y});svg+='<path d="'+d+'" stroke="#b59b75" stroke-width="12" stroke-dasharray="3 18" stroke-linecap="round" fill="none"/>'}
positions.forEach((pt,i)=>{const t=p.tasks[i],klass=t.done?'done':i===done?'active':'todo';svg+='<g class="stop '+klass+'" data-index="'+i+'" transform="translate('+pt.x+','+pt.y+')"><circle r="29"/><text text-anchor="middle" y="5">'+(t.done?'✓':i+1)+'</text><text text-anchor="middle" y="48" fill="#253b31" stroke="#f1e6be" paint-order="stroke" stroke-width="3">'+escapeHtml(t.name.slice(0,18))+'</text></g>'});svg+='</svg>';$('map').innerHTML=svg;$('map').querySelector('svg').style.height=Math.max(430,H*.48)+'px';$('map').querySelectorAll('.stop').forEach(el=>el.onclick=()=>openEditor('task',p.tasks[Number(el.dataset.index)]));
$('tasks').innerHTML='';p.tasks.forEach((t,i)=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.setAttribute('aria-label','Complete '+t.name);cb.onchange=()=>{t.done=cb.checked;saveData();render()};const label=document.createElement('span');label.textContent=(i+1)+'. '+t.name;const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>openEditor('task',t);const up=document.createElement('button');up.textContent='↑';up.disabled=i===0;up.onclick=()=>move(i,-1);const down=document.createElement('button');down.textContent='↓';down.disabled=i===p.tasks.length-1;down.onclick=()=>move(i,1);row.append(cb,label,up,down,edit);$('tasks').append(row)});}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function move(i,delta){const a=current().tasks;[a[i],a[i+delta]]=[a[i+delta],a[i]];saveData();render()}
function openEditor(type,item){mode=type;editing=item||null;$('dialogTitle').textContent=type==='project'?'Quest details':'Journey stop';$('name').value=item?.name||'';$('description').value=item?.description||'';$('remove').hidden=!item||type==='project';$('editor').showModal();$('name').focus()}
$('editForm').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;const description=$('description').value.trim();if(mode==='project'){if(editing){editing.name=name;editing.description=description}else{const p={id:uid(),name,description,tasks:[]};data.projects.push(p);data.selected=p.id}}else if(editing){editing.name=name;editing.description=description}else{current().tasks.push({id:uid(),name,description,done:false})}saveData();$('editor').close();render()};
$('cancel').onclick=()=>$('editor').close();$('remove').onclick=()=>{if(editing&&confirm('Delete this stop?')){current().tasks=current().tasks.filter(t=>t!==editing);saveData();$('editor').close();render()}};
$('newProject').onclick=()=>openEditor('project');$('add').onclick=()=>openEditor('task');$('projects').onchange=e=>{data.selected=e.target.value;saveData();render()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project-quest-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.projects)||!incoming.projects.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.tasks)&&p.tasks.every(t=>typeof t.id==='string'&&typeof t.name==='string')))throw Error('Invalid backup');if(confirm('Replace your current projects with this backup?')){data=incoming;saveData();render()}}catch(err){alert('Could not import backup: '+err.message)}e.target.value=''};
render();
</script></html>
